global:
  scrape_interval: 5s

scrape_configs:
  - job_name: xtel
    metrics_path: /api/v1/metrics
    http_headers:
      X-Xtel-Devops-Secret:
        files:
          - /run/secrets/xtel_devops_secret
    file_sd_configs:
      - files:
          - /etc/prometheus/targets.json
        refresh_interval: 10s
